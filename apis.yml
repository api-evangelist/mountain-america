name: Mountain America Credit Union
kind: company
description: >-
  Mountain America Credit Union (MACU) is a federally chartered, member-owned
  not-for-profit financial cooperative headquartered in Sandy, Utah, founded in
  1936 and regulated and insured by the National Credit Union Administration
  (NCUA). It is one of the largest credit unions in the United States, with
  roughly $21.9 billion in assets, more than 1.4 million members, and over 100
  branches serving Utah, Idaho, Montana, Nevada, and Arizona, offering consumer
  and business checking, savings, mortgages, auto loans, credit cards, and
  wealth services. Like the vast majority of US credit unions, Mountain America
  exposes no public first-party developer API or developer portal: there is no
  developer.macu.com or api.macu.com host, and every path under macu.com returns
  the same client-rendered application shell. Consumer-permissioned data access
  is intermediated through its core banking provider and data aggregators
  (Plaid, MX, Finicity, Akoya) rather than a directly published API. US open
  finance is voluntary and fragmented, and no public FDX participation or CFPB
  Section 1033 data-access posture is documented for this institution at the
  time of review.
