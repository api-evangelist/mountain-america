    aggregators:
      - Plaid
      - MX
      - Finicity
      - Akoya
    authModel: none-documented
    specProvenance: none
  institution:
    charter: federally chartered credit union
    regulator: NCUA
    headquarters: Sandy, Utah, United States
    founded: 1936
    assetsUSD: approximately 21.9 billion
    members: more than 1.4 million
    branches: over 100
    statesServed:
      - Utah
      - Idaho
      - Montana
      - Nevada
      - Arizona
  transports:
    - protocol: REST
      scheme: https
      documented: false
      note: No public REST API base URL is documented.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket surface is documented.
  probes:
    - url: https://developer.macu.com
      result: DNS NXDOMAIN (no such host)
    - url: https://api.macu.com
      result: connection failed / no response
    - url: https://www.macu.com
      status: 200
      note: Live homepage; client-rendered SPA shell.
    - url: https://macu.com/developers
      status: 200
      note: Same ~1152-byte SPA shell as unknown paths; soft-404, not a real developer portal.
    - url: https://macu.com/zzz-not-a-real-page-9876
      status: 200
      note: Nonexistent path also returns 200 with ~1151-byte identical shell, confirming soft-404 behavior.
