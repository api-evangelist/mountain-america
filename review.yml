  openapiHarvested: false
  reason: |
    No public API surface exists to model. The record is identity-only
    (built-stub) with an honest no-public-API, aggregator-only finding. Only
    verified links (Website, LinkedIn) were recorded; no hosts, specs, or
    endpoints were invented.
