aid: mountain-america
name: Mountain America Credit Union
review:
  question: Does Mountain America Credit Union expose a public first-party developer API, portal, or downloadable OpenAPI/Swagger spec?
  answer: false
  date: '2026-07-23'
  reviewer: API Evangelist
findings:
  summary: |
    Mountain America Credit Union (MACU) publishes no public first-party
    developer API and operates no developer portal. There is no
    developer.macu.com host (DNS NXDOMAIN) and no reachable api.macu.com.
    The macu.com site is a client-rendered single-page application: every
    requested path — including /developers, /api, /developer, /open-banking,
    /data-sharing — returns HTTP 200 with the same ~1151-1152 byte
    application shell, confirming those paths are soft-404s rather than
    documented API surfaces. No OpenAPI or Swagger definition is publicly
    downloadable, so none was harvested.

    This is the expected posture for a US credit union. US open finance is
    voluntary and fragmented (no mandated open-banking contract as in the UK
    or Australia). Consumer-permissioned data access is intermediated through
    MACU's core banking provider and third-party data aggregators
    (Plaid, MX, Finicity, Akoya) rather than a directly published API. No
    documented Financial Data Exchange (FDX) participation and no stated CFPB
    Section 1033 (Personal Financial Data Rights) data-access posture were
    found for this institution at review time. No authentication model
    (OAuth2/OIDC/API-key/mTLS) is documented because no public API exists.
  posture:
    firstPartyDeveloperPortal: false
    developerPortalURL: ""
    portalConfirmed: false
    downloadableOpenAPI: false
    fdxParticipant: false
    cfpb1033PostureDocumented: false
